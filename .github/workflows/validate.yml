name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the official plugin validator from MiniMax Code
        uses: actions/checkout@v4
        with:
          repository: MiniMax-AI/minimax-code
          path: .minimax-code
          sparse-checkout: |
            tools/plugins
            schemas/plugins
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all stacks
        env:
          MINIMAX_CODE_DIR: .minimax-code
        run: node scripts/check.mjs
